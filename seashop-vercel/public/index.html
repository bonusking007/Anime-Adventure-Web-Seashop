<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seashop | Anime Adventures Tracker</title>
<link rel="icon" href="logo.png">
<style>
:root{color-scheme:dark;--bg:#071520;--panel:#0e2332;--line:#274554;--text:#ecf7fc;--muted:#aec6d4;--accent:#81e9d7}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top right,#103746,transparent 55%),var(--bg);color:var(--text);font:16px/1.55 system-ui,sans-serif}
header{border-bottom:1px solid var(--line)}.wrap{width:min(960px,calc(100% - 32px));margin:auto}.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:70px}
a{color:var(--accent);text-decoration:none}.brand{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--text)}.brand img{width:40px;border-radius:10px}
main{padding:42px 0 60px}[hidden]{display:none!important}h1,h2,p{margin:0}h1{font-size:clamp(32px,6vw,60px);line-height:1.15}h2{font-size:23px}.muted{color:var(--muted)}
.hero{display:grid;place-items:center;text-align:center;min-height:60vh}.hero img{width:108px;border-radius:25px;margin-bottom:20px}.hero p{margin:12px 0 22px}
.button,button{display:inline-block;border:0;border-radius:10px;background:var(--accent);color:#092921;padding:9px 16px;font:inherit;font-weight:800;cursor:pointer}
.card{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:20px;margin-top:16px}
form{display:flex;flex-wrap:wrap;align-items:end;gap:12px}label{display:grid;gap:4px;flex:1 1 175px}input{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
#status{margin:14px 0;color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.metrics div{background:#0a1a26;border-radius:10px;padding:10px}.metrics strong{display:block;font-size:clamp(16px,4vw,28px);overflow-wrap:anywhere}.metrics small{color:var(--muted)}
ul{padding-left:22px;margin-bottom:0}:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<header><nav class="wrap nav" aria-label="เมนูหลัก">
<a class="brand" href="#home"><img src="logo.png" alt="">Seashop</a>
<a href="#dashboard">Dashboard</a>
</nav></header>
<main class="wrap">
<section class="hero" id="home">
<div><img src="logo.png" alt=""><h1>ยินดีต้อนรับสู่ Seashop</h1>
<p class="muted">ติดตามยอดเพชรและรางวัลรอบล่าสุดของผู้เล่น Anime Adventures</p>
<a class="button" href="#dashboard">เข้า Dashboard</a></div>
</section>
<section id="dashboard" hidden>
<h1>Anime Adventures</h1>
<form class="card" id="profile">
<label>Roblox User ID<input id="id" inputmode="numeric" pattern="[1-9][0-9]{0,15}" required></label>
<label>รหัสสำหรับดูข้อมูล<input id="key" type="password" autocomplete="off" required></label>
<button>เปิดโปรไฟล์</button>
</form>
<p id="status" role="status">ใส่ User ID ของบัญชีที่กำลังส่งข้อมูลจาก Tracker</p>
<section id="player" hidden>
<div class="card"><h2 id="name"></h2><p class="muted" id="updated"></p></div>
<div class="card metrics">
<div><small>เพชร</small><strong id="gems"></strong></div>
<div><small>ทอง</small><strong id="gold"></strong></div>
<div><small>เวฟ</small><strong id="wave"></strong></div>
</div>
<div class="card"><h2>รางวัลรอบล่าสุด</h2><p class="muted" id="stage"></p><ul id="rewards"></ul></div>
</section>
</section>
</main>
<script>
const byId = id => document.getElementById(id);
const status = byId('status');
const panel = byId('player');
const format = new Intl.NumberFormat('th-TH');
let refresh;
let generation = 0;
function route() {
  const dashboard = location.hash === '#dashboard';
  byId('home').hidden = dashboard;
  byId('dashboard').hidden = !dashboard;
  if (!dashboard) {
    clearInterval(refresh);
    generation++;
    panel.hidden = true;
    status.textContent = 'ใส่ User ID ของบัญชีที่กำลังส่งข้อมูลจาก Tracker';
  }
}
function render(player) {
  const time = new Date(player.updatedAt);
  const active = Date.now() - time.getTime() < 60_000;
  byId('name').textContent = player.displayName || player.username;
  byId('updated').textContent = '@' + player.username + ' · อัปเดต ' +
    time.toLocaleString('th-TH', { timeZone: 'Asia/Bangkok' });
  status.textContent = active ? 'กำลังรับข้อมูลจาก Tracker' : 'ยังไม่มีข้อมูลใหม่ใน 60 วินาทีล่าสุด';
  for (const field of ['gems','gold','wave']) {
    byId(field).textContent = player[field] == null ? '—' : format.format(player[field]);
  }
  const list = byId('rewards');
  list.replaceChildren();
  const round = player.round;
  byId('stage').textContent = round?.stage || (round ? 'รอบล่าสุด' : 'ยังไม่มีผลจบรอบ');
  for (const [key, label] of [['gems','เพชร'],['gold','ทอง']]) {
    if (round?.[key] == null) continue;
    const item = document.createElement('li');
    item.textContent = label + ' ×' + format.format(round[key]);
    list.append(item);
  }
  panel.hidden = false;
}
byId('profile').addEventListener('submit', event => {
  event.preventDefault();
  clearInterval(refresh);
  const current = ++generation;
  const id = byId('id').value;
  const key = byId('key').value;
  panel.hidden = true;
  status.textContent = 'กำลังโหลดข้อมูล…';
  let busy = false;
  async function load() {
    if (busy) return;
    busy = true;
    try {
      const res = await fetch('/api/player?id=' + encodeURIComponent(id), {
        headers: {'X-API-Key':key}, cache:'no-store'
      });
      if (current !== generation) return;
      if (res.status === 404) {
        status.textContent = 'ยังไม่ได้รับข้อมูลจาก User ID นี้ ระบบจะลองใหม่อัตโนมัติ';
        return;
      }
      if (res.status === 401) {
        status.textContent = 'รหัสสำหรับดูข้อมูลไม่ถูกต้อง';
        clearInterval(refresh);
        return;
      }
      if (!res.ok) throw new Error('Tracker unavailable');
      const data = await res.json();
      if (current === generation) render(data.player);
    } catch {
      if (current === generation) status.textContent = 'เชื่อมต่อ Tracker ไม่ได้ จะลองใหม่อัตโนมัติ';
    } finally {
      busy = false;
    }
  }
  refresh = setInterval(load, 15_000);
  load();
});
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
